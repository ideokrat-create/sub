<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { color: #666; }
    </style>
</head>
<body>
    <div class="loader">⏳ Перенаправление в QlikView...</div>
    
    <form id="qv_login" action="https://report.subjoy.ru/qlikview/FormLogin.htm" method="POST">
        <!-- Скрытые поля с логином и паролем -->
        <input type="hidden" name="username" value="test_mobile">
        <input type="hidden" name="password" value="test_m">
        
        <!-- Некоторые конфигурации QlikView требуют поле method, иногда оно должно быть post -->
        <input type="hidden" name="method" value="post">
    </form>

    <script>
        // Автоматическая отправка формы при загрузке страницы
        window.onload = function() {
            document.getElementById('qv_login').submit();
        };
    </script>
</body>
</html>
